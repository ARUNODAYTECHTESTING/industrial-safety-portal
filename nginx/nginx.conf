upstream backend {
    server web:8005;
}

server {
    listen 80;
    #server_name ec2-3-110-183-233.ap-south-1.compute.amazonaws.com 3.110.183.233;
    # server_name ec2-3-7-253-20.ap-south-1.compute.amazonaws.com;
    server_name ec2-13-202-121-239.ap-south-1.compute.amazonaws.com aegixcore.com;
    location / {
        proxy_pass http://backend;  # Use upstream instead of IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 500M;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }
}
